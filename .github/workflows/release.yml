name: Release Web SDK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (e.g., v1.2.3)"
        required: true
        type: string

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        shell: bash
        run: |
          TAG="$RELEASE_TAG"
          if [[ -z "$TAG" ]]; then
            echo "Input 'tag' is required." >&2
            exit 1
          fi
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag '$TAG' not found. Fetching..." >&2
            git fetch --tags
            git rev-parse "$TAG" >/dev/null 2>&1 || {
              echo "Tag '$TAG' still not found." >&2
              exit 1
            }
          fi
          git checkout "$TAG"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Ensure latest npm for trusted publishing
        run: npm install -g npm@latest

      - name: Verify tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            TAG="$RELEASE_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ "$TAG" != v* ]]; then
            echo "Tag '$TAG' must start with 'v'." >&2
            exit 1
          fi

          TAG_VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")

          echo "Tag version: $TAG_VERSION"
          echo "package.json version: $PKG_VERSION"

          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "Tag version does not match package.json version." >&2
            exit 1
          fi

      - name: Ensure version is unpublished
        run: |
          version=$(node -p "require('./package.json').version")
          published=$(npm view "@li-nk.me/web-sdk@$version" version --registry=https://registry.npmjs.org 2>/dev/null || true)
          if [[ "$published" == "$version" ]]; then
            echo "Version $version is already published; create a new immutable version." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Enforce coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Validate publish archive
        run: |
          npm pack --dry-run --json --ignore-scripts > pack.json
          node -e "const p=require('./pack.json')[0]; const files=p.files.map(f=>f.path); if(!files.includes('LICENSE') || files.some(f=>/\\.test\\./.test(f))) process.exit(1); console.log('archive-ok')"

      - name: Smoke test packed consumer
        run: |
          archive=$(npm pack --silent --ignore-scripts)
          consumer=$(mktemp -d)
          printf '{"type":"module","dependencies":{"@li-nk.me/web-sdk":"file:%s"}}\n' "$GITHUB_WORKSPACE/$archive" > "$consumer/package.json"
          npm install --prefix "$consumer" --ignore-scripts --no-audit --no-fund
          (cd "$consumer" && node --input-type=module -e "const m=await import('@li-nk.me/web-sdk'); if(typeof m.LinkMeWebClient !== 'function') throw new Error('LinkMeWebClient export missing')")

      - name: Publish
        run: npm publish --access public
