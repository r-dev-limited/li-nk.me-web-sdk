name: Web SDK CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:coverage
      - run: npm run build
      - name: Check publish archive
        run: |
          npm pack --dry-run --json --ignore-scripts > pack.json
          node -e "const raw=require('./pack.json'); const findFiles=v=>{if(!v||typeof v!=='object')return null;if(Array.isArray(v.files))return v.files;for(const child of Object.values(v)){const found=findFiles(child);if(found)return found}return null}; const entries=findFiles(raw); if(!entries) { console.error('npm pack JSON did not contain a files list'); process.exit(1) }; const files=entries.map(f=>typeof f==='string'?f:f.path); if(!files.includes('LICENSE') || files.some(f=>/\.test\./.test(f))) process.exit(1); console.log('archive-ok')"
      - name: Smoke test the packed consumer
        run: |
          archive=$(npm pack --silent --ignore-scripts)
          consumer=$(mktemp -d)
          printf '{"type":"module","dependencies":{"@li-nk.me/web-sdk":"file:%s"}}\n' "$GITHUB_WORKSPACE/$archive" > "$consumer/package.json"
          npm install --prefix "$consumer" --ignore-scripts --no-audit --no-fund
          (cd "$consumer" && node --input-type=module -e "const m=await import('@li-nk.me/web-sdk'); if(typeof m.LinkMeWebClient !== 'function') throw new Error('LinkMeWebClient export missing'); console.log('packed-esm-ok')")
